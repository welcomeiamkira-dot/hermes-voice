name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # AGP 8.5 needs Gradle 8.7 or newer
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download Vosk model into assets
        run: |
          set -e
          curl -fsSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q model.zip -d model-unzipped
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model
          mv "$(find model-unzipped -mindepth 1 -maxdepth 1 -type d | head -1)" app/src/main/assets/model
          ls app/src/main/assets/model
          test -f app/src/main/assets/model/am/final.mdl

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        env:
          HERMES_TOKEN: ${{ secrets.HERMES_TOKEN || 'CHANGE_ME' }}

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-build"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "latest-build" \
              --notes "Auto-built debug APK"
          fi
