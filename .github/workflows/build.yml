name: Build and Release APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.5
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build Release APK
        run: gradle assembleRelease
        env:
          HERMES_TOKEN: ${{ secrets.HERMES_TOKEN || 'CHANGE_ME' }}

      - name: Upload APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-build"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists, uploading APK..."
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            echo "Creating new release..."
            gh release create "$TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "latest-build" \
              --notes "Auto-built APK from $GITHUB_SHA"
          fi
